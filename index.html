<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BingX｜全部訊號</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, "Microsoft JhengHei", sans-serif;
      background: #0b1220;
      color: #f0f5ff;
      --panel: #121d30;
      --line: #2a3952;
      --muted: #a3b4ce;
      --accent: #85b7ff;
      --up: #67e2ad;
      --down: #ff9ba7;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(100% - 24px, 800px); margin: 0 auto; padding: 32px 0 48px; }
    header, .section-head, nav { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    header, .section-head { justify-content: space-between; }
    .brand { color: var(--accent); font-size: .78rem; font-weight: 800; letter-spacing: .14em; }
    h1 { margin: 6px 0; font-size: clamp(1.65rem, 5vw, 2.45rem); }
    h2 { margin: 0; font-size: 1.12rem; }
    p { margin: 0; }
    .muted { color: var(--muted); }
    button, nav a {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: inherit;
      padding: 8px 13px;
      text-decoration: none;
      font: inherit;
      font-size: .88rem;
    }
    button { cursor: pointer; background: #244576; border-color: #4266a0; }
    button:hover, nav a:hover { border-color: var(--accent); }
    button:disabled { opacity: .65; cursor: wait; }
    nav { margin: 22px 0 12px; }
    #status { min-height: 1.5em; font-size: .85rem; }
    #status.error { color: var(--down); }
    .boards { display: grid; gap: 16px; margin-top: 14px; }
    section { min-width: 0; }
    .section-head { margin-bottom: 8px; }
    .badge { font-size: .72rem; font-weight: 700; color: var(--accent); letter-spacing: .05em; }
    #forex .badge { color: #ffd588; }
    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .card {
      min-width: 0;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      font-variant-numeric: tabular-nums;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }
    .card-title { margin: 0; font-size: .86rem; }
    .trend { margin-top: 4px; font-size: .95rem; font-weight: 750; }
    .candle-time { margin-top: 3px; color: var(--muted); font-size: .68rem; }
    .empty { color: var(--muted); font-size: .85rem; }
    .up { color: var(--up); }
    .down { color: var(--down); }
    footer { margin-top: 18px; font-size: .78rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <div class="brand">BINGX MARKET WATCH</div>
        <h1>全部訊號</h1>
      </div>
      <button id="refresh" type="button">重新整理</button>
    </header>
    <nav aria-label="訊號分類">
      <a href="#forex">外匯</a>
      <a href="#crypto">加密合約</a>
      <a href="#stocks">股票</a>
    </nav>
    <p id="status" class="muted" role="status">正在掃描 1 小時趨勢…</p>
    <div id="boards" class="boards"></div>
    <footer>資料來源 BingX 公開行情 API · 每 60 秒自動更新</footer>
  </main>

  <template id="signal-card">
    <li class="card">
      <h3 class="card-title"></h3>
      <p class="trend"></p>
      <p class="candle-time"></p>
    </li>
  </template>

  <script>
    const markets = [
      { id: 'forex', label: '外匯', badge: 'XAU/USD' },
      { id: 'crypto', label: '加密合約' },
      { id: 'stocks', label: '股票' },
    ];
    const status = document.querySelector('#status');
    const refreshButton = document.querySelector('#refresh');
    const cardTemplate = document.querySelector('#signal-card');
    const updateTime = new Intl.DateTimeFormat('zh-TW', { timeStyle: 'medium', timeZone: 'Asia/Taipei' });
    const candleTime = new Intl.DateTimeFormat('zh-TW', { dateStyle: 'short', timeStyle: 'short', timeZone: 'Asia/Taipei' });
    let lastUpdate;

    for (const { id, label, badge } of markets) {
      document.querySelector('#boards').insertAdjacentHTML('beforeend', `
        <section id="${id}" aria-labelledby="${id}-title">
          <div class="section-head"><h2 id="${id}-title">${label}</h2><span class="badge">${badge ?? ''}</span></div>
          <p class="empty">等待掃描…</p>
          <ul class="cards" role="list" aria-labelledby="${id}-title"></ul>
        </section>`);
    }

    function renderMarket({ id }, { signals, total, scanned }) {
      const board = document.getElementById(id);
      const empty = board.querySelector('.empty');
      empty.hidden = signals.length > 0;
      empty.textContent = total === 0 ? '目前沒有可掃描的標的'
        : scanned === 0 ? '暫無可判斷的 K 線'
          : '目前沒有符合條件的訊號';

      const cards = document.createDocumentFragment();
      for (const { symbol, trend, closedAt } of signals) {
        const card = cardTemplate.content.cloneNode(true);
        const bullish = trend === 'bullish';
        card.querySelector('.card-title').textContent = id === 'forex' ? 'XAU/USD' : symbol.replace(/^NCSK(.+)2USD-USDT$/, '$1');
        const label = card.querySelector('.trend');
        label.textContent = bullish ? '多頭' : '空頭';
        label.classList.add(bullish ? 'up' : 'down');
        card.querySelector('.candle-time').textContent = `K 線收盤 ${candleTime.format(closedAt)}`;
        cards.append(card);
      }
      board.querySelector('.cards').replaceChildren(cards);
    }

    async function refresh() {
      if (refreshButton.disabled) return;
      refreshButton.disabled = true;
      status.classList.remove('error');
      status.textContent = '正在掃描 1 小時趨勢…';
      try {
        const response = await fetch('https://bingx-markets.ootdacc519.workers.dev/api/signals');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        const counts = { total: 0, scanned: 0 };
        for (const market of markets) {
          const board = data.markets[market.id];
          renderMarket(market, board);
          counts.total += board.total;
          counts.scanned += board.scanned;
        }
        lastUpdate = updateTime.format(data.fetchedAt);
        const pending = counts.total - counts.scanned;
        status.textContent = `掃描更新 ${lastUpdate}${pending ? ` · ${pending} 個標的暫無法判斷` : ''}`;
      } catch (error) {
        status.classList.add('error');
        status.textContent = `讀取訊號失敗 · ${error.message}${lastUpdate ? ` · 上次更新 ${lastUpdate}` : ''}`;
        if (!lastUpdate) {
          for (const message of document.querySelectorAll('.empty')) message.textContent = '暫無訊號';
        }
      } finally {
        refreshButton.disabled = false;
      }
    }

    refreshButton.addEventListener('click', refresh);
    refresh();
    setInterval(refresh, 60000);
  </script>
</body>
</html>
