<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#080d14">
  <title>Codex Bot</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Codex Bot">
  <link rel="stylesheet" href="styles.css?v=bryce-3">
</head>
<body>
  <div id="appShell">
    <header class="app-header">
      <a class="brand" href="#signals">
        <span class="brand-emoji" aria-hidden="true">👾</span>
        <span class="brand-wordmark"><strong>CODEX BOT</strong></span>
      </a>
      <div class="header-actions" aria-label="快捷功能">
        <div class="broadcast-menu-wrap">
          <button class="header-icon-button" id="broadcastMenuButton" type="button" aria-label="近期訊號" aria-expanded="false" data-action="broadcast">📢</button>
          <section class="broadcast-menu" id="broadcastMenu" aria-label="近期訊號">
            <div class="broadcast-menu-head"><h2>近期訊號</h2></div>
            <div class="broadcast-group-title"><span>訊號紀錄</span></div>
            <div class="broadcast-history-list" id="broadcastHistoryList"></div>
          </section>
        </div>
        <div class="notification-menu-wrap">
          <button class="header-icon-button" id="notificationMenuButton" type="button" aria-label="通知設定" aria-expanded="false" data-action="notifications">🔔</button>
          <section class="notification-menu" id="notificationMenu" aria-label="通知設定" hidden>
            <h2>通知設定</h2>
            <div class="notification-options">
              <label class="notification-option"><input id="toastNotifyToggle" type="checkbox"><span class="notification-check" aria-hidden="true"></span><span>彈窗通知</span></label>
              <label class="notification-option"><input id="soundNotifyToggle" type="checkbox"><span class="notification-check" aria-hidden="true"></span><span>通知音效</span></label>
              <label class="notification-option"><input id="entryNotifyToggle" type="checkbox"><span class="notification-check" aria-hidden="true"></span><span>進場通知</span></label>
              <label class="notification-option"><input id="tpNotifyToggle" type="checkbox"><span class="notification-check" aria-hidden="true"></span><span>止盈通知</span></label>
              <label class="notification-option"><input id="slNotifyToggle" type="checkbox"><span class="notification-check" aria-hidden="true"></span><span>止損通知</span></label>
              <label class="notification-option"><input id="hedgeNotifyToggle" type="checkbox"><span class="notification-check" aria-hidden="true"></span><span>套保通知</span></label>
              <label class="notification-option"><input id="ftpNotifyToggle" type="checkbox"><span class="notification-check" aria-hidden="true"></span><span>FTP變更通知</span></label>
              <label class="notification-option"><input id="raisedSlNotifyToggle" type="checkbox"><span class="notification-check" aria-hidden="true"></span><span>上移止損通知</span></label>
            </div>
            <div class="device-push-block">
              <b>裝置推播（鎖屏通知）</b>
              <p>即使關掉這個分頁也能在手機鎖屏 / 桌面收到訊號通知</p>
              <button id="enablePushButton" type="button">啟用裝置推播</button>
            </div>
          </section>
        </div>
      </div>
    </header>

    <main class="terminal-shell">
      <section class="market-board" aria-labelledby="marketBoardTitle">
        <div class="market-board-head">
          <div>
            <p class="market-board-kicker">BINGX · USDT-M PERPETUAL</p>
            <h1 id="marketBoardTitle">永續合約行情</h1>
          </div>
          <span id="marketConnection" class="market-connection" role="status">連線中</span>
        </div>
        <form id="marketAddForm" class="market-add-form">
          <label for="marketSymbol">新增合約</label>
          <input id="marketSymbol" name="symbol" type="text" placeholder="例如 BTC-USDT" autocomplete="off" spellcheck="false" maxlength="20">
          <button type="submit">加入</button>
          <span id="marketFormMessage" class="market-form-message" role="status"></span>
        </form>
        <div id="marketCards" class="market-cards" aria-live="polite"></div>
        <p class="market-board-note">價格為 BingX 永續合約最近成交價；更新時間為本機收到報價的時間。</p>
      </section>
      <section id="signals" class="signals-dashboard">
        <section id="signalsView" class="view-panel">
          <section class="stat-grid" aria-label="訊號統計"></section>
          <div class="list-head">
            <h1>全部訊號 <span id="signalCount">(0 / 0)</span></h1>
            <div class="list-actions">
              <select id="statusFilter" aria-label="訊號篩選">
                <option value="all">全部</option>
                <option value="active">未平倉</option>
                <option value="closed">減倉、清倉</option>
              </select>
              <button class="refresh-button" id="refreshBtn" type="button">更新</button>
            </div>
          </div>
          <div id="signalGrid" class="terminal-grid" aria-live="polite"></div>
        </section>
      </section>
    </main>
  </div>
  <script>
    try {
      localStorage.removeItem("cat-signal-orders-v5");
      localStorage.removeItem("cat-db-migrated-v1");
    } catch {}
  </script>
  <script src="notification-guard.js?v=1"></script>
  <script src="price-feed.js?v=10"></script>
  <script src="market-board.js?v=5"></script>
  <script src="app.js?v=143"></script>
  <script src="recent-order-fix.js?v=2"></script>
  <script src="closed-price-fix.js?v=3"></script>
  <script src="raised-sl.js?v=5"></script>
  <script src="push-fix.js?v=2"></script>
</body>
</html>
