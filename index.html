<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codex Bot｜模擬交易帳本</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #0b0e11;
      color: #f5f5f5;
    }
    body {
      min-height: 100svh;
      margin: 0;
      padding: 1.25rem;
      box-sizing: border-box;
      display: grid;
      place-items: center;
    }
    main {
      box-sizing: border-box;
      width: min(100%, 28rem);
      padding: 2rem;
      border: 1px solid #38331d;
      border-radius: 1rem;
      background: #15191d;
    }
    .brand { color: #fcd535; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: .5rem 0; }
    p { margin: 0; color: #b8bdc5; }
    a {
      display: block;
      margin-top: 1.5rem;
      padding: .85rem 1rem;
      border-radius: .5rem;
      background: #fcd535;
      color: #0b0e11;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
    }
    a:hover { background: #ffe066; }
    a:focus-visible { outline: 2px solid white; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <p class="brand">CODEX BOT</p>
    <h1>模擬交易帳本</h1>
    <p>請使用有試算表權限的 Google 帳號開啟。</p>
    <a href="https://docs.google.com/spreadsheets/d/1IQA62q7jnxAuP8TYZj9KGnevfkuIpkaqLxsRMj3zBZE/edit?gid=64100#gid=64100">開啟雲端帳本</a>
  </main>
</body>
</html>
