<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BingX｜合約成交額排行</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, "Microsoft JhengHei", sans-serif;
      background: #0b1220;
      color: #f0f5ff;
      --panel: #121d30;
      --line: #2a3952;
      --muted: #a3b4ce;
      --accent: #85b7ff;
      --up: #67e2ad;
      --down: #ff9ba7;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(100% - 24px, 800px); margin: 0 auto; padding: 32px 0 48px; }
    header, .section-head, nav { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    header, .section-head { justify-content: space-between; }
    .brand { color: var(--accent); font-size: .78rem; font-weight: 800; letter-spacing: .14em; }
    h1 { margin: 6px 0; font-size: clamp(1.65rem, 5vw, 2.45rem); }
    h2 { margin: 0; font-size: 1.12rem; }
    p { margin: 0; }
    .muted { color: var(--muted); }
    button, nav a {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: inherit;
      padding: 8px 13px;
      text-decoration: none;
      font: inherit;
      font-size: .88rem;
    }
    button { cursor: pointer; background: #244576; border-color: #4266a0; }
    button:hover, nav a:hover { border-color: var(--accent); }
    button:disabled { opacity: .65; cursor: wait; }
    nav { margin: 22px 0 12px; }
    #status { min-height: 1.5em; font-size: .85rem; }
    #status.error { color: var(--down); }
    .boards { display: grid; gap: 16px; margin-top: 14px; }
    section { min-width: 0; }
    .section-head { margin-bottom: 8px; }
    .badge { font-size: .72rem; font-weight: 700; color: var(--accent); letter-spacing: .05em; }
    #gold .badge { color: #ffd588; }
    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .card {
      min-width: 0;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      font-variant-numeric: tabular-nums;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }
    .card-title {
      display: flex;
      align-items: baseline;
      gap: 5px;
      margin: 0;
      font-size: .86rem;
    }
    .rank { flex: none; color: var(--accent); font-size: .71rem; }
    .metrics { display: grid; gap: 2px; margin: 5px 0 0; }
    .metrics > div {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: baseline;
      gap: 0 5px;
    }
    .metrics dt { color: var(--muted); font-size: .68rem; }
    .metrics dd { min-width: 0; margin: 0 0 0 auto; text-align: right; font-size: .78rem; font-weight: 650; }
    .empty { color: var(--muted); font-size: .85rem; }
    .up { color: var(--up); }
    .down { color: var(--down); }
    footer { margin-top: 18px; font-size: .78rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <div class="brand">BINGX MARKET WATCH</div>
        <h1>合約成交額排行</h1>
      </div>
      <button id="refresh" type="button">重新整理</button>
    </header>
    <nav aria-label="榜單導覽">
      <a href="#gold">黃金</a>
      <a href="#crypto">加密貨幣</a>
      <a href="#stocks">股票</a>
    </nav>
    <p id="status" class="muted" role="status">正在連線 BingX…</p>
    <div id="boards" class="boards"></div>
    <footer>資料來源 BingX 公開行情 API · 每 60 秒自動更新</footer>
  </main>

  <template id="quote-card">
    <li class="card">
      <h3 class="card-title"><span class="rank" aria-hidden="true"></span><span class="contract-name"></span></h3>
      <dl class="metrics">
        <div><dt>最新價</dt><dd class="price"></dd></div>
        <div><dt>24h 漲跌</dt><dd class="change"></dd></div>
      </dl>
    </li>
  </template>

  <script>
    const markets = [
      { id: 'gold', label: '黃金', badge: 'XAU/USD', limit: 1 },
      { id: 'crypto', label: '加密貨幣', badge: 'TOP 30', limit: 30 },
      { id: 'stocks', label: '股票', badge: 'TOP 10', limit: 10 },
    ];
    const goldSymbol = 'NCCOGOLD2USD-USDT';
    const status = document.querySelector('#status');
    const refreshButton = document.querySelector('#refresh');
    const cardTemplate = document.querySelector('#quote-card');
    const priceFormat = new Intl.NumberFormat('zh-TW', { maximumSignificantDigits: 10 });
    const changeFormat = new Intl.NumberFormat('zh-TW', {
      style: 'percent', signDisplay: 'exceptZero', minimumFractionDigits: 2, maximumFractionDigits: 2,
    });
    const timeFormat = new Intl.DateTimeFormat('zh-TW', { timeStyle: 'medium' });
    let lastUpdate;

    for (const { id, label, badge } of markets) {
      document.querySelector('#boards').insertAdjacentHTML('beforeend', `
        <section id="${id}" aria-labelledby="${id}-title">
          <div class="section-head"><h2 id="${id}-title">${label}</h2><span class="badge">${badge}</span></div>
          <p class="empty">等待行情…</p>
          <ol class="cards" role="list" aria-labelledby="${id}-title"></ol>
        </section>`);
    }

    function number(value) {
      return value == null || String(value).trim() === '' ? NaN : Number(value);
    }

    function selectMarkets({ quotes, classifications }) {
      const types = new Map(classifications.map(({ symbol, contractType }) => [symbol, contractType]));
      const groups = { gold: [], crypto: [], stocks: [] };
      for (const quote of quotes) {
        const { symbol } = quote;
        const turnover = number(quote.quoteVolume);
        if (typeof symbol !== 'string' || !symbol.endsWith('-USDT') || !Number.isFinite(turnover) || turnover < 0) continue;

        const type = types.get(symbol);
        const row = { ...quote, turnover };
        if (symbol === goldSymbol) groups.gold.push(row);
        else if (type === 'nonCryptoStock') groups.stocks.push(row);
        else if (!type && !/^(?:NCCO|NCFX|NCSK|NCSI)/.test(symbol)) groups.crypto.push(row);
      }
      return groups;
    }

    function renderMarket({ id, limit }, quotes) {
      const board = document.getElementById(id);
      const ranked = quotes.sort((a, b) => b.turnover - a.turnover || a.symbol.localeCompare(b.symbol)).slice(0, limit);
      const empty = board.querySelector('.empty');
      empty.hidden = ranked.length > 0;
      empty.textContent = '目前沒有行情';

      const cards = document.createDocumentFragment();
      ranked.forEach((quote, index) => {
        const card = cardTemplate.content.cloneNode(true);
        const price = number(quote.lastPrice);
        const change = number(quote.priceChangePercent);
        const name = id === 'gold' ? 'XAU/USD' : quote.symbol.replace(/^NCSK(.+)2USD-USDT$/, '$1');
        card.querySelector('.rank').textContent = `#${index + 1}`;
        card.querySelector('.contract-name').textContent = name;
        card.querySelector('.price').textContent = Number.isFinite(price) ? priceFormat.format(price) : '—';
        const changeValue = card.querySelector('.change');
        changeValue.textContent = Number.isFinite(change) ? changeFormat.format(change / 100) : '—';
        if (change > 0) changeValue.classList.add('up');
        if (change < 0) changeValue.classList.add('down');
        cards.append(card);
      });
      board.querySelector('.cards').replaceChildren(cards);
    }

    async function refresh() {
      if (refreshButton.disabled) return;
      refreshButton.disabled = true;
      status.classList.remove('error');
      status.textContent = '正在更新 BingX 行情…';
      try {
        const response = await fetch('https://bingx-markets.ootdacc519.workers.dev/api/markets');
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
        const groups = selectMarkets(data);
        for (const market of markets) renderMarket(market, groups[market.id]);
        lastUpdate = timeFormat.format(data.fetchedAt);
        status.textContent = `最後更新 ${lastUpdate}`;
      } catch (error) {
        status.classList.add('error');
        status.textContent = `讀取失敗 · ${error.message}${lastUpdate ? ` · 上次更新 ${lastUpdate}` : ''}`;
        if (!lastUpdate) {
          for (const message of document.querySelectorAll('.empty')) message.textContent = '暫無行情';
        }
      } finally {
        refreshButton.disabled = false;
      }
    }

    refreshButton.addEventListener('click', refresh);
    refresh();
    setInterval(refresh, 60000);
  </script>
</body>
</html>
